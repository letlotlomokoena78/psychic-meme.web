<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login - Cheeseboy Fashion</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="admin-page">
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html"><h1>Cheeseboy</h1></a>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for products...">
                <button>Search</button>
            </div>
            <div class="header-icons">
                <a href="account.html" class="icon">Account</a>
                <a href="wishlist.html" class="icon">Wishlist</a>
                <a href="cart.html" class="icon">Cart</a>
            </div>
        </div>
    </header>

    <nav>
        <div class="container">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="women.html">Women</a></li>
                <li><a href="men.html">Men</a></li>
                <li><a href="kids.html">Kids</a></li>
                <li><a href="beauty.html">Beauty</a></li>
                <li><a href="sales.html">Sale</a></li>
                <li><a href="seller-login.html">Sell</a></li>
                <li><a href="account.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <section class="account">
        <div class="container">
            <h2>Seller Portal</h2>
            <div class="account-tabs">
                <button class="tab-button active" onclick="showTab('sellerlogin')">Seller Login</button>
                <button class="tab-button" onclick="showTab('sellerapply')">Apply To Sell</button>
            </div>
            <div id="sellerlogin" class="tab-content active">
                <form class="account-form" id="seller-login-form">
                    <h4>Seller Login</h4>
                    <input type="email" id="seller-email" placeholder="Seller Email" required>
                    <input type="password" id="seller-password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <button type="button" id="seller-passkey-btn" class="secondary-btn">Use Passkey</button>
                </form>
            </div>
            <div id="sellerapply" class="tab-content">
                <form class="account-form" id="seller-application-form">
                    <h4>Seller Application</h4>
                    <input type="text" id="seller-company" placeholder="Company Name" required>
                    <input type="email" id="seller-app-email" placeholder="Contact Email" required>
                    <input type="text" id="seller-category" placeholder="Selling Category" required>
                    <input type="number" id="seller-interest" placeholder="Interest Rate (%)" required>
                    <textarea id="seller-description" placeholder="Brief description" rows="4"></textarea>
                    <button type="submit">Apply to Sell</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Cheeseboy Fashion powered by WAGWAN digitals</p>
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </footer>

    <script src="../../js/pages/script.js"></script>
    <script src="../../js/pages/seller.js"></script>
</body>
</html>
