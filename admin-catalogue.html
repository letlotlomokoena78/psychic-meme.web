<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Manager - Admin - Cheeseboy Fashion</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="admin-page">
    <header class="admin-header"><div class="container"></div></header>

    <section class="catalogue-management">
        <div class="container">
            <div class="management-header">
                <h2>Catalogue Manager</h2>
                <a href="admin-dashboard.html" class="back-btn">Back to Dashboard</a>
            </div>

            <div class="add-category-section">
                <h3>Add Category</h3>
                <form id="add-category-form" class="catalogue-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category-title">Category Title</label>
                            <input type="text" id="category-title" placeholder="e.g. Golf" required>
                        </div>
                    </div>
                    <button type="submit" class="upload-btn">Save Category</button>
                </form>
            </div>

            <div class="add-catalogue-section">
                <h3>Add Catalogue Entry</h3>
                <form id="add-catalogue-form" class="catalogue-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="catalogue-title">Title</label>
                            <input type="text" id="catalogue-title" required>
                        </div>
                        <div class="form-group">
                            <label for="catalogue-category">Category</label>
                            <select id="catalogue-category" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="catalogue-image">Image URL</label>
                            <input type="url" id="catalogue-image" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="form-group">
                            <label for="catalogue-page">Page Link</label>
                            <input type="text" id="catalogue-page" placeholder="women.html" required>
                        </div>
                    </div>
                    <button type="submit" class="upload-btn">Add Catalogue</button>
                </form>
            </div>

            <div class="catalogue-list-section">
                <h3>Existing Catalogue Entries</h3>
                <div id="catalogue-list" class="catalogue-grid"></div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Cheeseboy Fashion powered by WAGWAN digitals</p>
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
        </div>
    </footer>

    <script src="../../../js/pages/script.js"></script>
    <script src="../../../js/admin/admin-catalogue.js"></script>
    <script src="js/auth-check.js"></script>
</body>
</html>
