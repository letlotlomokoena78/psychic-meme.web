<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Orders - Admin - Cheeseboy Fashion</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="admin-page">
    <header class="admin-header"><div class="container"></div></header>

    <section class="order-management">
        <div class="container">
            <div class="management-header">
                <h2>Order Management</h2>
                <a href="admin-dashboard.html" class="back-btn">Back to Dashboard</a>
            </div>
            <p id="monitor-status" class="monitor-status">Automatic order monitoring enabled. Page refreshes every 10 seconds.</p>

            <div class="order-stats">
                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <p id="total-orders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending Orders</h3>
                    <p id="pending-orders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Completed Orders</h3>
                    <p id="completed-orders">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <p id="total-revenue">$0.00</p>
                </div>
            </div>

            <div class="orders-list-section">
                <h3>Recent Orders</h3>
                <div id="orders-list" class="orders-table">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Cheeseboy Fashion powered by WAGWAN digitals</p>
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </footer>

    <script src="../../../js/pages/script.js"></script>
    <script src="../../../js/admin/admin-orders.js"></script>
    <script src="js/auth-check.js"></script>
</body>
</html>
