<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Admin - Cheeseboy Fashion</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="admin-page">
    <header class="admin-header"><div class="container"></div></header>

    <section class="product-management">
        <div class="container">
            <div class="management-header">
                <h2>Product Management</h2>
                <a href="admin-dashboard.html" class="back-btn">Back to Dashboard</a>
            </div>

            <div class="add-product-section">
                <h3>Add New Product</h3>
                <form id="add-product-form" class="product-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-name">Product Name</label>
                            <input type="text" id="product-name" required>
                        </div>
                        <div class="form-group">
                            <label for="product-category">Category</label>
                            <select id="product-category" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-type">Product Type</label>
                            <input type="text" id="product-type" placeholder="e.g. Shoes, Shirt, Golf T-Shirt" required>
                        </div>
                        <div class="form-group">
                            <label for="product-price">Price ($)</label>
                            <input type="number" id="product-price" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="product-image">Product Image</label>
                            <div class="image-upload-area" id="image-upload-area">
                                <input type="file" id="product-image-file" accept="image/*" style="display: none;">
                                <div class="upload-placeholder">
                                    <p>Drag & drop an image here or <button type="button" id="browse-btn" class="upload-btn">Browse</button></p>
                                    <p class="upload-hint">Supported formats: JPG, PNG, GIF</p>
                                </div>
                                <img id="image-preview" src="" alt="" style="display: none; max-width: 200px; max-height: 200px;">
                            </div>
                            <input type="url" id="product-image-url" placeholder="Or enter image URL" style="margin-top: 10px;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="product-description">Description</label>
                        <textarea id="product-description" rows="4"></textarea>
                    </div>
                    <button type="submit" class="upload-btn">Add Product</button>
                </form>
            </div>

            <div class="products-list-section">
                <h3>Existing Products</h3>
                <div id="products-list" class="products-grid">
                    <!-- Products will be loaded here -->
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Cheeseboy Fashion powered by WAGWAN digitals</p>
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </footer>

    <script src="../../../js/pages/script.js"></script>
    <script src="../../../js/admin/admin-products.js"></script>
    <script src="js/auth-check.js"></script>
</body>
</html>
