<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Cheeseboy Fashion</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html"><h1>Cheeseboy</h1></a>
            </div>

            <div class="header-icons">


            </div>
        </div>
    </header>

    <nav>
        <div class="container">
        </div>
    </nav>

    <section class="account">
        <div class="container">
            <h2>My Account</h2>
            <div class="account-tabs">
                <button class="tab-button active" data-tab="login" onclick="showTab('login')">Login</button>
                <button class="tab-button" data-tab="signup" onclick="showTab('signup')">Sign Up</button>
                <button class="tab-button" id="profile-tab-button" data-tab="profile" onclick="showTab('profile')" style="display:none;">Profile</button>
            </div>

            <div id="login" class="tab-content active">
                <form id="login-form" class="account-form">
                    <h3>Login</h3>
                    <p class="login-note"></p>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </form>
                <form id="Other options." class="Form" style="margin-top: 20px;">
                    <h3>Other options.</h3>
                    <button type="submit" class="upload-btn" style="margin-bottom: 10px;">Login with Google</button>
                    <button type="submit" class="upload-btn">Login with Facebook</button>
                </form>
            </div>

            <div id="signup" class="tab-content">
                <form id="signup-form" class="account-form">
                    <h3>Sign Up</h3>
                    <input type="text" placeholder="First Name" required>
                    <input type="text" placeholder="Last Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="submit">Sign Up</button>
                </form>
                <form id="Other options." class="Form" style="margin-top: 20px;">
                    <h3>Other options.</h3>
                    <button type="submit" class="upload-btn" style="margin-bottom: 10px;">Login with Google</button>
                    <button type="submit" class="upload-btn">Login with Facebook</button>
                </form>
            </div>

            <div id="profile" class="tab-content">
                <div class="account-form">
                    <h3>Profile</h3>
                    <div class="settings-card">
                        <p><strong>Name:</strong> <span id="profile-name"></span></p>
                        <p><strong>Email:</strong> <span id="profile-email"></span></p>
                        <p><strong>Status:</strong> <span id="profile-status"></span></p>
                    </div>
                    <div class="settings-card">
                        <h4>Settings</h4>
                        <label><input type="checkbox" id="profile-setting-notifications"> Receive notifications</label>
                        <label><input type="checkbox" id="profile-setting-emails"> Receive personalized emails</label>
                        <label><input type="checkbox" id="profile-setting-darkmode"> Enable dark mode</label>
                    </div>
                    <div class="settings-card">
                        <h4>Account Actions</h4>
                        <button id="profile-save-btn" class="upload-btn">Save Settings</button>
                        <button id="profile-logout-btn" class="logout-btn">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Cheeseboy Fashion powered by WAGWAN digitals</p>
            <ul>
                <li><a href="account.html">Admin</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </footer>

    <script src="../../js/pages/script.js"></script>
    <script src="../../js/auth/account.js"></script>
</body>
</html>
