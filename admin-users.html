<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin - Cheeseboy Fashion</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="admin-page">
    <header class="admin-header"><div class="container"></div></header>

    <section class="user-management">
        <div class="container">
            <div class="management-header">
                <h2>User Management</h2>
                <a href="admin-dashboard.html" class="back-btn">Back to Dashboard</a>
            </div>

            <div class="user-stats">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p id="total-users">0</p>
                </div>
                <div class="stat-card">
                    <h3>Active Users</h3>
                    <p id="active-users">0</p>
                </div>
                <div class="stat-card">
                    <h3>New This Month</h3>
                    <p id="new-users">0</p>
                </div>
                <div class="stat-card">
                    <h3>Admin Users</h3>
                    <p id="admin-users">2</p>
                </div>
            </div>

            <div class="add-user-section">
                <h3>Add New Admin User</h3>
                <form id="add-admin-form" class="user-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="admin-username">Username</label>
                            <input type="text" id="admin-username" required>
                        </div>
                        <div class="form-group">
                            <label for="admin-email">Email</label>
                            <input type="email" id="admin-email" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="admin-password">Password</label>
                            <input type="password" id="admin-password" required>
                        </div>
                        <div class="form-group">
                            <label for="admin-role">Role</label>
                            <select id="admin-role" required>
                                <option value="admin">Admin</option>
                                <option value="superadmin">Super Admin</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="upload-btn">Add Admin User</button>
                </form>
            </div>

            <div class="users-list-section">
                <h3>Admin Users</h3>
                <div id="admin-users-list" class="users-table">
                    <!-- Admin users will be loaded here -->
                </div>
            </div>

            <div class="users-list-section">
                <h3>Regular Users</h3>
                <div id="regular-users-list" class="users-table">
                    <!-- Regular users will be loaded here -->
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Cheeseboy Fashion powered by WAGWAN digitals</p>
            <ul>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Privacy Policy</a></li>
            </ul>
        </div>
    </footer>

    <script src="../../../js/pages/script.js"></script>
    <script src="../../../js/admin/admin-users.js"></script>
    <script src="js/auth-check.js"></script>
</body>
</html>
